# 의존성 자동 갱신: 주 1회(월요일, 한국 시간) PR을 연다. PR은 기본 브랜치(master)로 간다.
# 주의: 이 설정은 기본 브랜치(master)에 병합된 뒤부터 동작한다.
# 커밋 메시지는 Conventional Commits 형식(chore(deps): ...)을 따른다.
version: 2

updates:
  # 웹 서버 npm 패키지
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # 프론트엔드 라이브러리(public/vendor/로 복사해서 서빙)는 따로 묶는다. 여러 그룹에 맞으면 먼저 적힌 그룹에 들어간다.
      # 이 PR은 vendor 복사본을 갱신하기 전까지 CI(vendor.test.js)가 실패한다. 절차: .github/PIPELINE_GUIDE.md "프론트엔드 라이브러리"
      frontend-libs:
        patterns:
          - 'cytoscape*'
          - 'cose-base'
          - 'layout-base'
          - 'dagre'
          - 'd3-*'
          - '@highlightjs/cdn-assets'
      # 개발 도구의 minor/patch 갱신은 PR 하나로 묶는다
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # tree-sitter 계열은 문법 패키지와 peer 버전이 맞물려 있어서 메이저는 직접 올린다
      - dependency-name: 'tree-sitter*'
        update-types: ['version-update:semver-major']

  # GitHub Actions (SHA 고정을 유지한 채 갱신된다)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  # Docker 베이스 이미지 (web/Dockerfile의 태그 + digest)
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    commit-message:
      prefix: chore(deps)
    ignore:
      # Node 22 고정(.nvmrc, engines)과 맞춰야 하므로 메이저는 직접 올린다
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Android(gradle)는 앱 출시 계획이 없어 보류했다. 다시 쓸 때 package-ecosystem: gradle, directory: / 항목을 추가한다.
