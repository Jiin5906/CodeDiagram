# 의존성 자동 갱신: 주 1회(월요일, 한국 시간) PR을 연다. PR은 통합 브랜치 ci/pipeline으로 보낸다.
# 커밋 메시지는 Conventional Commits 형식(chore(deps): ...)을 따른다.
version: 2

updates:
  # 웹 서버 npm 패키지
  - package-ecosystem: npm
    directory: /web
    target-branch: ci/pipeline
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # 개발 도구의 minor/patch 갱신은 PR 하나로 묶는다
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # tree-sitter 계열은 문법 패키지와 peer 버전이 맞물려 있어서 메이저는 직접 올린다
      - dependency-name: 'tree-sitter*'
        update-types: ['version-update:semver-major']

  # GitHub Actions (SHA 고정을 유지한 채 갱신된다)
  - package-ecosystem: github-actions
    directory: /
    target-branch: ci/pipeline
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  # Docker 베이스 이미지 (web/Dockerfile의 태그 + digest)
  - package-ecosystem: docker
    directory: /web
    target-branch: ci/pipeline
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    commit-message:
      prefix: chore(deps)
    ignore:
      # Node 22 고정(.nvmrc, engines)과 맞춰야 하므로 메이저는 직접 올린다
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Android(gradle)는 앱 출시 계획이 없어 보류했다. 다시 쓸 때 package-ecosystem: gradle, directory: / 항목을 추가한다.
